name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import check
        run: python -c "from backend.main import create_app; from ai_layer import ChatBotGraph; print('imports OK')"

      - name: Unit checks (quota parsing / model validation)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/test_quota_parsing.py
          # The model validation check needs a key, so it is skipped without one.
          if [ -n "$GEMINI_API_KEY" ]; then
            python scripts/test_model_validation.py
          else
            echo "GEMINI_API_KEY not set - skipping the model validation check"
          fi

      - name: Start the API and smoke test it
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health > /dev/null && break
            sleep 1
          done
          python scripts/smoke_test.py

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Syntax check
        working-directory: frontend
        run: node --check server.js && node --check public/js/app.js

      - name: Start the frontend and check it serves
        working-directory: frontend
        run: |
          node server.js &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:3000/ > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/__health | head -c 400
          echo
